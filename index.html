function au(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();ma=ac.createGain();ma.gain.value=.35;ma.connect(ac.destination);
 nz=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nz.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}
const mf=n=>440*Math.pow(2,(n-69)/12);
function osc(ty,f1,f2,du,v,t0){const t=t0||ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+du);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+du);o.connect(gn).connect(ma);o.start(t);o.stop(t+du+.02)}
function noise(du,v,fq,t0,ty){const t=t0||ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=nz;f.type=ty||'lowpass';f.frequency.value=fq;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+du);s.connect(f).connect(gn).connect(ma);s.start(t);s.stop(t+du)}
function sfx(k){if(!ac)return;if(k=='s')osc('square',700,200,.08,.1);else if(k=='b'){noise(.45,.6,500);osc('sine',90,30,.4,.7)}else if(k=='h')osc('sawtooth',220,70,.15,.18);else if(k=='p'){osc('sine',600,610,.1,.2);osc('sine',900,910,.15,.2,ac.currentTime+.09)}}
const PAT=[0,-1,12,-1,7,-1,10,-1,0,-1,12,-1,5,-1,3,7];
function music(){if(!ac||(S!='play'&&S!='lvl'))return;const t=TH[lv];while(nextT<ac.currentTime+.15){const s=step%16,d=60/t.bpm/4;
 if(PAT[s]>=0){const o=ac.createOscillator(),f=ac.createBiquadFilter(),gn=ac.createGain();o.type='sawtooth';o.frequency.value=mf(t.r+PAT[s]);f.type='lowpass';f.frequency.setValueAtTime(900,nextT);f.frequency.exponentialRampToValueAtTime(180,nextT+d);gn.gain.setValueAtTime(.4,nextT);gn.gain.exponentialRampToValueAtTime(.001,nextT+d*.95);o.connect(f).connect(gn).connect(ma);o.start(nextT);o.stop(nextT+d)}
 if(s%4==0)osc('sine',150,40,.14,.8,nextT);if(s%2==1)noise(.05,.12,7000,nextT,'highpass');nextT+=d;step++}}

function setL(){WW=lv==5?3200:3800;CX=0;pl=[];let s=lv*131;const r=()=>(s=(s*9301+49297)%233280)/233280;for(let x=380;x<WW-420;x+=230+r()*170)pl.push([x,[420,370,330][r()*3|0],120+r()*80]);BL=[];PITS=[];for(let x=720;x<WW-(lv==5?1300:500);x+=330+r()*220){const t3=r();if(t3<.3)PITS.push([x,x+90+r()*20]);else if(t3<.55)BL.push({x,y:GY-60,w:60,h:60});else if(t3<.75){BL.push({x,y:GY-50,w:50,h:50});BL.push({x:x+50,y:GY-100,w:50,h:100})}else BL.push({x,y:GY-150,w:26,h:26,q:1})}E=[];B=[];C=[];kills=0;bs=0;P.x=100;P.y=GY-P.h;P.vy=0;P.hp=Math.min(100,P.hp+20);for(let x=650;x<WW-(lv==5?700:300);x+=170+r()*(260-lv*25)){if(lv>=2&&r()<.35)E.push({fly:1,x,y:80,by:90+r()*110,w:28,h:18,hp:2,t:80,ph:r()*6,s:.9});else if(!BL.some(k=>x+30>k.x&&x<k.x+k.w+10)&&!PITS.some(q=>x+30>q[0]&&x<q[1]+10))E.push({x,y:GY-36,w:22,h:36,hp:3,t:60+r()*60,s:1+lv*.12,vy:0})}if(lv==5)E.push({boss:1,x:WW-260,y:GY-110,w:90,h:110,hp:80,mh:80,t:60,dt:200,dir:1});for(let i=0;i<4;i++)crate(500+i*(WW-800)/4+r()*200,-30);msg='SEVİYE '+lv+': '+TH[lv].n;msgT=150;say(SAY[lv])}

const inPit=o=>PITS.some(q=>o.x+o.w/2>q[0]&&o.x+o.w/2<q[1]);

 if(!(o.drop>0))for(const q of pl)if(o.x+o.w>q[0]&&o.x<q[0]+q[2]&&b-o.vy<=q[1]+1&&b>=q[1]){o.y=q[1]-o.h;o.vy=0;o.gr=true;return}}
